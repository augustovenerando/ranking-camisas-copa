<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking Camisas Copa 2026</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:18px}
.topbar{position:sticky;top:0;z-index:10;background:#111;border-bottom:1px solid #333;padding:12px;text-align:center}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
select,button{padding:10px 14px;border-radius:10px;border:0;font-weight:bold}
button{cursor:pointer;background:#f5c542}
.status{font-size:13px;color:#bbb;margin-top:8px}
.team{margin:35px 0}
.team h2{border-left:6px solid #f5c542;padding-left:10px}
.kits{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:#1d1d1d;border:1px solid #333;border-radius:18px;overflow:hidden}
.imgbox{height:300px;background:#000;display:flex;align-items:center;justify-content:center;color:#777;text-align:center}
.imgbox img{width:100%;height:100%;object-fit:contain;background:#fff}
.content{padding:16px}
.kit-title{font-size:20px;font-weight:bold;margin-bottom:12px}
.question{margin:14px 0}
.star{font-size:26px;cursor:pointer;filter:grayscale(1);opacity:.35}
.star.active{filter:none;opacity:1}
.tag{display:inline-block;border:1px solid #555;border-radius:999px;padding:8px 12px;margin:4px;cursor:pointer}
.tag.active{background:#f5c542;color:#000;font-weight:bold}
.rankings{margin-top:40px}
.ranking-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.ranking-box{background:#1d1d1d;border:1px solid #333;border-radius:18px;padding:16px}
.ranking-item{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:9px 0;gap:8px}
.badge{font-size:11px;background:#333;border-radius:999px;padding:3px 7px;margin-right:4px}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>

<div class="topbar">
<h1>🏆 Ranking Camisas Copa 2026</h1>
<div>Lindo vs Linda</div>
<div class="controls">
<select id="currentUser">
<option value="lindo">Lindo</option>
<option value="linda">Linda</option>
</select>
<button id="saveBtn">Salvar avaliações</button>
<button id="imageBtn">Atualizar imagens do guia</button>
</div>
<div id="status" class="status">Carregando...</div>
</div>

<div id="teams"></div>

<section class="rankings">
<h2>📊 Rankings</h2>
<div class="ranking-grid">
<div class="ranking-box"><h3>⭐ Geral — Lindo</h3><div id="ranking-geral-lindo"></div></div>
<div class="ranking-box"><h3>⭐ Geral — Linda</h3><div id="ranking-geral-linda"></div></div>
<div class="ranking-box"><h3>🎨 Bonita — Lindo</h3><div id="ranking-bonita-lindo"></div></div>
<div class="ranking-box"><h3>🎨 Bonita — Linda</h3><div id="ranking-bonita-linda"></div></div>
<div class="ranking-box"><h3>👕 Usaria depois — Lindo</h3><div id="ranking-uso-lindo"></div></div>
<div class="ranking-box"><h3>👕 Usaria depois — Linda</h3><div id="ranking-uso-linda"></div></div>
</div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDm-g6OTM_fDHYSv1FEqDt1ULC281EtK4U",
authDomain:"ranking-camisas-copa-202-3a2f2.firebaseapp.com",
projectId:"ranking-camisas-copa-202-3a2f2",
storageBucket:"ranking-camisas-copa-202-3a2f2.firebasestorage.app",
messagingSenderId:"909673035671",
appId:"1:909673035671:web:eeb3ba06a51374f6d8f6d2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const GUIDE = "https://mantosdofutebol.com.br/2026/06/camisas-copa-do-mundo-2026/";
const PROXIES = [
"https://api.allorigins.win/raw?url=" + encodeURIComponent(GUIDE),
"https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(GUIDE)
];

const teamNames = [
"México","África do Sul","Coréia do Sul","República Tcheca",
"Canadá","Bósnia-Herzegovina","Catar","Suíça",
"Brasil","Marrocos","Haiti","Escócia",
"Estados Unidos","Paraguai","Austrália","Turquia",
"Alemanha","Curaçao","Costa do Marfim","Equador",
"Holanda","Japão","Suécia","Tunísia",
"Bélgica","Egito","Irã","Nova Zelândia",
"Espanha","Cabo Verde","Arábia Saudita","Uruguai",
"França","Senegal","Iraque","Noruega",
"Argentina","Argélia","Áustria","Jordânia",
"Portugal","RD Congo","Uzbequistão","Colômbia",
"Inglaterra","Croácia","Gana","Panamá"
];

const teams = teamNames.map(name=>({
name,
kits:[1,2,3].map(n=>({id:slug(name)+n,title:`${name} ${n}`,image:null}))
}));

let votes = {};
let dirty = {};
const statusEl = document.getElementById("status");

function slug(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")}
function norm(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}

function emptyVote(){return{beauty:0,use:0,sair:false,treino:false}}

async function loadAllVotes(){
for(const user of ["lindo","linda"]){
for(const team of teams){
for(const kit of team.kits){
const id = `${user}_${kit.id}`;
const snap = await getDoc(doc(db,"votes",id));
votes[id] = snap.exists()?snap.data():emptyVote();
}
}
}
}

function getVote(user,kitId){
const id = `${user}_${kitId}`;
if(!votes[id]) votes[id]=emptyVote();
return votes[id];
}

function setDirty(user,kitId){
dirty[`${user}_${kitId}`]=true;
statusEl.textContent = "Você tem alterações não salvas.";
}

function render(){
const container=document.getElementById("teams");
const user=document.getElementById("currentUser").value;
container.innerHTML="";

teams.forEach(team=>{
const div=document.createElement("div");
div.className="team";
div.innerHTML=`<h2>${team.name}</h2><div class="kits"></div>`;
const kitsDiv=div.querySelector(".kits");

team.kits.forEach(kit=>{
const v=getVote(user,kit.id);
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<div class="imgbox">
${kit.image?`<img src="${kit.image}" onerror="this.parentElement.innerHTML='Camisa ainda não divulgada'">`:`Camisa ainda não divulgada`}
</div>
<div class="content">
<div class="kit-title">${kit.title}</div>

<div class="question">
<p>Eu acho ela bonita?</p>
<div>${stars(v.beauty,"beauty",kit.id)}</div>
</div>

<div class="question">
<p>Eu usaria depois da Copa?</p>
<div>${stars(v.use,"use",kit.id)}</div>
</div>

<div class="question">
<p>Eu usaria para:</p>
<span class="tag ${v.sair?"active":""}" data-kit="${kit.id}" data-type="sair">Sair</span>
<span class="tag ${v.treino?"active":""}" data-kit="${kit.id}" data-type="treino">Jogar/Treinar</span>
</div>
</div>`;
kitsDiv.appendChild(card);
});
container.appendChild(div);
});
bindActions();
renderRankings();
}

function stars(value,type,kitId){
let html="";
for(let i=1;i<=5;i++){
html+=`<span class="star ${i<=value?"active":""}" data-kit="${kitId}" data-type="${type}" data-value="${i}">⭐</span>`;
}
return html;
}

function bindActions(){
document.querySelectorAll(".star").forEach(el=>{
el.onclick=()=>{
const user=document.getElementById("currentUser").value;
const kitId=el.dataset.kit;
const type=el.dataset.type;
const value=Number(el.dataset.value);
const v=getVote(user,kitId);
v[type]=v[type]===value?0:value;
setDirty(user,kitId);
render();
};
});

document.querySelectorAll(".tag").forEach(el=>{
el.onclick=()=>{
const user=document.getElementById("currentUser").value;
const kitId=el.dataset.kit;
const type=el.dataset.type;
const v=getVote(user,kitId);
v[type]=!v[type];
setDirty(user,kitId);
render();
};
});
}

async function saveAll(){
const keys=Object.keys(dirty);
if(!keys.length){statusEl.textContent="Nada novo para salvar.";return}
statusEl.textContent="Salvando avaliações...";
for(const key of keys){
await setDoc(doc(db,"votes",key),votes[key]);
}
dirty={};
statusEl.textContent="Avaliações salvas com sucesso.";
renderRankings();
}

async function loadImages(){
statusEl.textContent="Buscando imagens no guia...";
for(const proxy of PROXIES){
try{
const html=await fetch(proxy).then(r=>r.text());
if(!html || html.length<1000) continue;

teams.forEach((team,idx)=>{
const start=html.search(new RegExp(`<h3[^>]*>\\s*${escapeReg(team.name)}\\s*<\\/h3>`,"i"));
if(start<0) return;

let end=html.length;
for(let j=idx+1;j<teams.length;j++){
const next=html.search(new RegExp(`<h3[^>]*>\\s*${escapeReg(teams[j].name)}\\s*<\\/h3>`,"i"));
if(next>start){end=next;break}
}

const block=html.slice(start,end);
const imgs=[...block.matchAll(/https?:\/\/assets-mantosdofutebol[^"'\s<>]+?\.(?:jpg|jpeg|png|webp)/gi)]
.map(m=>m[0].replace(/-\d+x\d+(?=\.(jpg|jpeg|png|webp))/i,""))
.filter((v,i,a)=>a.indexOf(v)===i);

imgs.slice(0,3).forEach((src,i)=>teams[idx].kits[i].image=src);
});

localStorage.setItem("teamsImages",JSON.stringify(teams.map(t=>t.kits.map(k=>k.image))));
statusEl.textContent="Imagens atualizadas. Camisas sem imagem continuam pretas.";
render();
return;
}catch(e){}
}
statusEl.textContent="Não consegui puxar as imagens automaticamente. Vamos preencher por links diretos se necessário.";
}

function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}

function restoreImages(){
const saved=localStorage.getItem("teamsImages");
if(!saved) return false;
const imgs=JSON.parse(saved);
teams.forEach((t,i)=>t.kits.forEach((k,j)=>k.image=imgs[i]?.[j]||null));
return true;
}

function renderRankings(){
["lindo","linda"].forEach(user=>{
const data=[];
teams.forEach(team=>team.kits.forEach(kit=>{
const v=getVote(user,kit.id);
data.push({title:kit.title,total:(v.beauty||0)+(v.use||0),beauty:v.beauty||0,use:v.use||0,sair:v.sair,treino:v.treino});
}));
rank(`ranking-geral-${user}`,[...data].sort((a,b)=>b.total-a.total),"total");
rank(`ranking-bonita-${user}`,[...data].sort((a,b)=>b.beauty-a.beauty),"beauty");
rank(`ranking-uso-${user}`,[...data].sort((a,b)=>b.use-a.use),"use");
});
}

function rank(id,data,key){
const el=document.getElementById(id);
el.innerHTML="";
data.filter(x=>x[key]>0).forEach((x,i)=>{
el.innerHTML+=`
<div class="ranking-item">
<div><strong>${i+1}. ${x.title}</strong><br>
${x.sair?'<span class="badge">Sair</span>':''}
${x.treino?'<span class="badge">Jogar/Treinar</span>':''}
</div>
<div>⭐ ${x[key]}</div>
</div>`;
});
if(!el.innerHTML) el.innerHTML='<div class="small">Ainda sem votos.</div>';
}

document.getElementById("saveBtn").onclick=saveAll;
document.getElementById("imageBtn").onclick=loadImages;
document.getElementById("currentUser").onchange=render;

await loadAllVotes();
if(!restoreImages()) await loadImages();
statusEl.textContent="Pronto. Vote e depois clique em Salvar avaliações.";
render();
</script>
</body>
</html>
