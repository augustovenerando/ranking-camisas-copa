<title>Ranking Camisas Copa 2026</title>

<style>
:root{--bg:#0b0b12;--text:#fff;--muted:#bbbbcc;--blue:#4f6bff;--purple:#9b6dff;--green:#c5ff00;--gold:#f5c542}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:radial-gradient(circle at top left,rgba(255,77,77,.16),transparent 24%),radial-gradient(circle at top right,rgba(79,107,255,.16),transparent 24%),linear-gradient(135deg,#0b0b12,#12121b 60%,#171725);color:var(--text);padding:18px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:rgba(12,12,18,.94);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:18px;margin-bottom:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.header-title{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.header-title img{width:58px;height:auto;object-fit:contain}
h1{font-size:32px;font-weight:800}
.subtitle{text-align:center;color:var(--muted);margin-bottom:16px;font-size:14px}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
select,button{padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#1d1d29;color:white;font-weight:700;font-size:14px}
button{cursor:pointer;transition:.2s}
button:hover{transform:translateY(-1px);opacity:.92}
#imageBtn{background:linear-gradient(135deg,var(--blue),#6d83ff)}
#goRankingBtn{background:linear-gradient(135deg,var(--purple),#b084ff)}
#clearBtn{background:linear-gradient(135deg,#c70039,#ff4d6d)}
#saveBtn{background:linear-gradient(135deg,var(--green),#86d400);color:black}
.status{text-align:center;margin-top:12px;font-size:13px;color:var(--muted)}
.team{margin:42px 0;scroll-margin-top:170px}
.team h2{display:flex;align-items:center;gap:12px;font-size:30px;margin-bottom:18px;padding-left:12px;border-left:6px solid var(--gold)}
.flag{width:34px;height:24px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.18);background:#222}
.kits{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:linear-gradient(180deg,#1a1a26,#141420);border:1px solid rgba(255,255,255,.08);border-radius:24px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.imgbox{height:320px;background:linear-gradient(135deg,rgba(255,77,77,.15),rgba(79,107,255,.12),rgba(197,255,0,.08));display:flex;align-items:center;justify-content:center;padding:20px}
.imgbox img{width:100%;height:100%;object-fit:contain;background:white;border-radius:12px;padding:10px}
.content{padding:18px}
.kit-title{font-size:22px;font-weight:800;margin-bottom:16px}
.question{margin:18px 0}
.question p{margin-bottom:10px;color:#e7e7f0;font-weight:600}
.star{font-size:28px;cursor:pointer;filter:grayscale(1);opacity:.28;transition:transform .18s ease,opacity .18s ease,filter .18s ease;display:inline-block}
.star:hover{transform:scale(1.18) rotate(-4deg)}
.star.active{filter:none;opacity:1;animation:starPop .22s ease}
@keyframes starPop{0%{transform:scale(.85)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.tag{display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);margin-right:8px;margin-top:6px;cursor:pointer;background:#20202e}
.tag.active{background:linear-gradient(135deg,var(--gold),#ffd95c);color:black;font-weight:800;border-color:transparent}
.rankings{margin-top:50px;scroll-margin-top:170px}
.rankings h2{font-size:34px;margin-bottom:22px}
.ranking-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.ranking-box{background:linear-gradient(180deg,#1a1a26,#141420);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.ranking-box h3{margin-bottom:16px;font-size:22px}
.ranking-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:999px;margin-top:6px;margin-right:6px;background:#2b2b3b}
.small{color:var(--muted);font-size:13px}
#backToTopBtn{position:fixed;right:14px;bottom:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,30,.62);color:white;font-size:24px;font-weight:800;z-index:80;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#backToTopBtn:hover{background:rgba(245,197,66,.85);color:#111}
@media(max-width:700px){
body{padding:10px}.topbar{position:relative;top:auto;border-radius:18px;padding:12px;margin-bottom:18px}.header-title{gap:8px;margin-bottom:6px}.header-title img{width:42px}h1{font-size:20px;line-height:1.15}.subtitle{font-size:12px;margin-bottom:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.controls select,.controls button{width:100%;height:54px;padding:0 10px;font-size:13px;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;border-radius:14px}#currentUser,#teamJump{height:54px;grid-column:span 1}#clearBtn{grid-column:1/-1}#saveBtn{grid-column:1/-1;height:56px}.status{font-size:12px;line-height:1.3;margin-top:8px}.team{margin:28px 0;scroll-margin-top:20px}.team h2{font-size:22px;margin-bottom:12px}.flag{width:30px;height:21px}.kits{grid-template-columns:1fr;gap:14px}.card{border-radius:18px}.imgbox{height:245px;padding:12px}.content{padding:14px}.kit-title{font-size:19px;margin-bottom:10px}.question{margin:14px 0}.star{font-size:25px}.tag{font-size:13px;padding:8px 11px}.rankings{margin-top:34px;scroll-margin-top:20px}.rankings h2{font-size:26px}.ranking-grid{grid-template-columns:1fr 1fr;gap:10px}.ranking-box{min-width:0}.ranking-box h3{font-size:15px;line-height:1.25}.ranking-item{font-size:12px;gap:6px}.badge{font-size:9px;padding:3px 6px}.ranking-item strong{font-size:12px}
}
</style>
</head>

const teams = teamNames.map(name=>({
name,
kits:[1,2,3].map(n=>({
id:slug(name)+n,
title:`${name} ${n}`,
image:SHIRTS[name]?.[n] || null
}))
}));

let votes = {};
let dirty = {};
const statusEl = document.getElementById("status");

function slug(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")}
function flagUrl(name){const code=countryCodes[name];return code?`https://flagcdn.com/w80/${code}.png`:""}
function emptyVote(){return {beauty:0,use:0,sair:false,treino:false}}
function medal(i){return i===0?"🥇":i===1?"🥈":i===2?"🥉":""}

async function loadAllVotes(){
for(const user of ["lindo","linda"]){
for(const team of teams){
for(const kit of team.kits){
const id=`${user}_${kit.id}`;
const snap=await getDoc(doc(db,"votes",id));
votes[id]=snap.exists()?snap.data():emptyVote();
}
}
}
}

function getVote(user,kitId){
const id=`${user}_${kitId}`;
if(!votes[id]) votes[id]=emptyVote();
return votes[id];
}

function setDirty(user,kitId){
dirty[`${user}_${kitId}`]=true;
statusEl.textContent="Você tem alterações não salvas.";
}

function setupTeamJump(){
const teamJump=document.getElementById("teamJump");
teamJump.innerHTML=`<option value="">Ir para seleção...</option>`;
teams.filter(t=>t.kits.some(k=>k.image)).forEach(team=>{
const option=document.createElement("option");
option.value="team-"+slug(team.name);
option.textContent=team.name;
teamJump.appendChild(option);
});
teamJump.onchange=()=>{
if(teamJump.value){
const target=document.getElementById(teamJump.value);
if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
teamJump.value="";
}
};
}

function render(){
const container=document.getElementById("teams");
const user=document.getElementById("currentUser").value;
container.innerHTML="";

teams.forEach(team=>{
const visibleKits=team.kits.filter(kit=>kit.image);
if(!visibleKits.length) return;

const div=document.createElement("div");
div.className="team";
div.id="team-"+slug(team.name);
div.innerHTML=`
<h2>
<img class="flag" src="${flagUrl(team.name)}" alt="Bandeira ${team.name}" loading="lazy" onerror="this.style.display='none'">
<span>${team.name}</span>
</h2>
<div class="kits"></div>
`;
const kitsDiv=div.querySelector(".kits");

visibleKits.forEach(kit=>{
const v=getVote(user,kit.id);
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<div class="imgbox">
<img src="${kit.image}" loading="lazy" decoding="async" onerror="this.closest('.card').remove()">
</div>
<div class="content">
<div class="kit-title">${kit.title}</div>
<div class="question"><p>Eu acho ela bonita?</p><div>${stars(v.beauty,"beauty",kit.id)}</div></div>
<div class="question"><p>Eu usaria depois da Copa?</p><div>${stars(v.use,"use",kit.id)}</div></div>
<div class="question">
<p>Eu usaria para:</p>
<span class="tag ${v.sair?"active":""}" data-kit="${kit.id}" data-type="sair">Sair</span>
<span class="tag ${v.treino?"active":""}" data-kit="${kit.id}" data-type="treino">Jogar/Treinar</span>
</div>
</div>
`;
kitsDiv.appendChild(card);
});
container.appendChild(div);
});

bindActions();
renderRankings();
}

function stars(value,type,kitId){
let html="";
for(let i=1;i<=5;i++){
html+=`<span class="star ${i<=value?"active":""}" data-kit="${kitId}" data-type="${type}" data-value="${i}">★</span>`;
}
return html;
}

function bindActions(){
document.querySelectorAll(".star").forEach(el=>{
el.onclick=()=>{
const user=document.getElementById("currentUser").value;
const kitId=el.dataset.kit;
const type=el.dataset.type;
const value=Number(el.dataset.value);
const v=getVote(user,kitId);
v[type]=v[type]===value?0:value;
setDirty(user,kitId);
render();
};
});

document.querySelectorAll(".tag").forEach(el=>{
el.onclick=()=>{
const user=document.getElementById("currentUser").value;
const kitId=el.dataset.kit;
const type=el.dataset.type;
const v=getVote(user,kitId);
v[type]=!v[type];
setDirty(user,kitId);
render();
};
});
}

async function saveAll(){
const keys=Object.keys(dirty);
if(!keys.length){statusEl.textContent="Nada novo para salvar.";return}
statusEl.textContent="Salvando avaliações...";
for(const key of keys){await setDoc(doc(db,"votes",key),votes[key])}
dirty={};
statusEl.textContent="Avaliações salvas com sucesso.";
renderRankings();
}

async function clearCurrentUserVotes(){
const user=document.getElementById("currentUser").value;
const label=user==="lindo"?"Lindo":"Linda";
if(!confirm(`Apagar todas as avaliações do perfil ${label}?`)) return;
statusEl.textContent=`Apagando avaliações do perfil ${label}...`;
for(const team of teams){
for(const kit of team.kits){
const key=`${user}_${kit.id}`;
votes[key]=emptyVote();
delete dirty[key];
await deleteDoc(doc(db,"votes",key));
}
}
statusEl.textContent=`Avaliações do perfil ${label} apagadas.`;
render();
}

function renderRankings(){
["lindo","linda"].forEach(user=>{
const data=[];
teams.forEach(team=>team.kits.forEach(kit=>{
const v=getVote(user,kit.id);
data.push({
title:kit.title,
total:(v.beauty||0)+(v.use||0),
beauty:v.beauty||0,
use:v.use||0,
sair:v.sair,
treino:v.treino
});
}));

rank(`ranking-geral-${user}`,[...data].sort((a,b)=>b.total-a.total),"total");
rank(`ranking-bonita-${user}`,[...data].sort((a,b)=>b.beauty-a.beauty),"beauty");

rankUso(`ranking-uso-${user}`,[...data].sort((a,b)=>{
const scoreA=(a.sair&&a.treino)?3:a.sair?2:a.treino?1:0;
const scoreB=(b.sair&&b.treino)?3:b.sair?2:b.treino?1:0;
if(scoreB!==scoreA) return scoreB-scoreA;
return b.total-a.total;
}));
});
}

function rank(id,data,key){
const el=document.getElementById(id);
el.innerHTML="";
data.filter(x=>x[key]>0).slice(0,10).forEach((x,i)=>{
el.innerHTML+=`
<div class="ranking-item">
<div>
<strong>${medal(i)} ${i+1}. ${x.title}</strong><br>
${x.sair?'<span class="badge">Sair</span>':''}
${x.treino?'<span class="badge">Jogar/Treinar</span>':''}
</div>
<div>★ ${x[key]}</div>
</div>`;
});
if(!el.innerHTML) el.innerHTML='<div class="small">Ainda sem votos.</div>';
}

function rankUso(id,data){
const el=document.getElementById(id);
el.innerHTML="";
data.filter(x=>x.sair||x.treino).slice(0,10).forEach((x,i)=>{
el.innerHTML+=`
<div class="ranking-item">
<div>
<strong>${medal(i)} ${i+1}. ${x.title}</strong><br>
${x.sair?'<span class="badge">Sair</span>':''}
${x.treino?'<span class="badge">Jogar/Treinar</span>':''}
</div>
<div>★ ${x.total}</div>
</div>`;
});
if(!el.innerHTML) el.innerHTML='<div class="small">Ainda sem votos.</div>';
}

document.getElementById("saveBtn").onclick=saveAll;
document.getElementById("clearBtn").onclick=clearCurrentUserVotes;
document.getElementById("imageBtn").onclick=()=>{
statusEl.textContent="Imagens estáticas já carregadas. Não há busca automática nesta versão.";
render();
};
document.getElementById("goRankingBtn").onclick=()=>{
document.getElementById("rankings").scrollIntoView({behavior:"smooth",block:"start"});
};
document.getElementById("currentUser").onchange=render;

const backToTopBtn=document.getElementById("backToTopBtn");
window.addEventListener("scroll",()=>{backToTopBtn.style.display=window.scrollY>500?"flex":"none"});
backToTopBtn.onclick=()=>{window.scrollTo({top:0,behavior:"smooth"})};

setupTeamJump();
await loadAllVotes();
statusEl.textContent="Pronto. Vote e depois clique em Salvar avaliações.";
render();
</script>
</body>
</html>
